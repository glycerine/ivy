<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="8" fill="#fff"/>
  <g fill="none" stroke="#222" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main vine/spine curving upward -->
    <path d="M32,58 C30,48 28,38 26,28 C24,20 26,12 30,6" stroke-width="3.5"/>

    <!-- Top leaf (3 lobes) -->
    <g transform="translate(28,10)">
      <!-- Left lobe -->
      <path d="M0,0 C-6,-2 -12,-8 -10,-14 C-8,-18 -2,-16 2,-12" stroke-width="2.5" fill="#fff"/>
      <!-- Center lobe -->
      <path d="M2,-12 C0,-18 -2,-24 2,-28 C6,-24 4,-18 2,-12" stroke-width="2.5" fill="#fff"/>
      <!-- Right lobe -->
      <path d="M2,-12 C6,-16 12,-18 14,-14 C16,-8 10,-2 4,0" stroke-width="2.5" fill="#fff"/>
      <!-- Veins -->
      <path d="M2,0 C2,-4 2,-8 2,-12" stroke-width="1.8"/>
      <path d="M2,-8 C-2,-10 -6,-12 -8,-14" stroke-width="1.5"/>
      <path d="M2,-8 C6,-10 10,-12 12,-14" stroke-width="1.5"/>
    </g>

    <!-- Middle leaf (3 lobes, angled left) -->
    <g transform="translate(27,28) rotate(15)">
      <path d="M0,0 C-5,-1 -10,-6 -8,-11 C-6,-14 -1,-13 2,-10" stroke-width="2.5" fill="#fff"/>
      <path d="M2,-10 C0,-15 -1,-20 2,-23 C5,-20 4,-15 2,-10" stroke-width="2.5" fill="#fff"/>
      <path d="M2,-10 C5,-13 10,-14 11,-11 C12,-6 8,-1 3,0" stroke-width="2.5" fill="#fff"/>
      <path d="M2,0 C2,-3 2,-7 2,-10" stroke-width="1.8"/>
      <path d="M2,-7 C-1,-8 -4,-10 -6,-11" stroke-width="1.5"/>
      <path d="M2,-7 C5,-8 8,-10 10,-11" stroke-width="1.5"/>
    </g>

    <!-- Bottom leaf (3 lobes, angled right) -->
    <g transform="translate(30,44) rotate(-10)">
      <path d="M0,0 C-4,-1 -8,-5 -7,-9 C-5,-12 -1,-11 1,-8" stroke-width="2.5" fill="#fff"/>
      <path d="M1,-8 C0,-12 -1,-16 1,-19 C4,-16 3,-12 1,-8" stroke-width="2.5" fill="#fff"/>
      <path d="M1,-8 C4,-10 8,-11 9,-9 C10,-5 7,-1 3,0" stroke-width="2.5" fill="#fff"/>
      <path d="M1,0 C1,-3 1,-5 1,-8" stroke-width="1.8"/>
      <path d="M1,-5 C-1,-7 -3,-8 -5,-9" stroke-width="1.5"/>
      <path d="M1,-5 C3,-7 6,-8 8,-9" stroke-width="1.5"/>
    </g>
  </g>
</svg>
