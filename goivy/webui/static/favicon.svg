<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Yellow-green capital I with black drop shadow on a transparent background">
  <defs>
    <linearGradient id="ivyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8F000"/>
      <stop offset="100%" stop-color="#E7F92B"/>
    </linearGradient>
  </defs>

  <!-- transparent background -->

  <!-- black drop shadow, down-right at 45 degrees, without inner horizontal shadow lines -->
  <g fill="#000000">
    <!-- top beam: right-side shadow only -->
    <polygon points="460,28 484,52 484,148 460,124"/>

    <!-- center beam: right-side shadow only -->
    <polygon points="312,124 336,148 336,412 312,388"/>

    <!-- bottom beam: right-side and bottom shadow -->
    <polygon points="460,388 484,412 484,508 460,484"/>
    <polygon points="52,484 460,484 484,508 76,508"/>
  </g>

  <!-- main I -->
  <g fill="url(#ivyGrad)">
    <rect x="52" y="28" width="408" height="96"/>
    <rect x="200" y="124" width="112" height="264"/>
    <rect x="52" y="388" width="408" height="96"/>
  </g>
</svg>
